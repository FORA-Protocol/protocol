# The ruff rule set for the Python the gates cover, the files scripts/gates/scope.py
# lists: the SDK (sdk/python, whose pyproject.toml extends this file and adds its
# module waivers), the hand-written modules and the tests of gen/python, and the
# scripts under scripts/. extend-exclude below names the generated modules, so a
# plain `ruff` run leaves them out too. Ruff reads the nearest configuration, so a tree without a
# [tool.ruff] table of its own uses this one.
# The gates that run it are scripts/gates/gate-python-format.sh and
# scripts/gates/gate-python-lint.sh.

line-length = 100
target-version = "py311"

# The generated modules, written by scripts/gen-sdk-types.sh and buf from proto/:
# never edited by hand, regenerated and drift-gated instead. force-exclude applies the
# list to paths named on the command line too.
extend-exclude = [
  "gen/python/wire/models.py",
  "gen/python/wire/unique.py",
  "gen/python/vocab",
]
force-exclude = true

# Python sources only. Ruff also formats the code blocks of Markdown files by default;
# the examples in the READMEs are documentation, laid out by hand for reading.
include = ["*.py", "*.pyi", "**/pyproject.toml", "**/ruff.toml"]

# The generated types export (gen/python, published as fora-protocol) supports Python
# 3.9, so its hand-written modules are held to that target: no rule may rewrite them
# into syntax a 3.9 interpreter refuses.
[per-file-target-version]
"gen/python/**" = "py39"

[lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PERF", "FURB", "RUF",
  "PL", "ASYNC", "S", "TCH", "ARG", "RET", "PTH", "TID", "C90",
]

# Size and complexity limits. They apply to tests as to any other file. The size
# limits are this repository's own choice, as AGENTS.md records; the complexity
# limit is cyclomatic complexity 10, McCabe's limit, which NIST SP 500-235
# recommends. Ruff measures no cognitive complexity. A file's length is checked by
# scripts/gates/gate-file-length.sh, the one file-length check for every language.
[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 12
max-returns = 6
max-statements = 50

[lint.per-file-ignores]
# Test modules, in every tree. S101: pytest's assertion is the plain `assert`
# statement, so the rule against asserts cannot apply to a pytest suite. PLR2004: an
# assertion compares against the literal value the corpus or the specification
# states, and a named constant for each would move that value away from the check.
"**/tests/**" = ["PLR2004", "S101"]
"scripts/**/test_*.py" = ["PLR2004", "S101"]
# The gate tooling files that run developer tools: ratchet.py runs the command line
# its gate script passes, scope.py runs git, and the test harness runs git and the
# copied scripts. S603
# and S607 flag every subprocess call whose arguments are not literals or whose
# program is found on PATH, which is each call these files exist to make. No argument comes from outside the repository's own gate
# scripts. The waiver names each file, so new code elsewhere is held to both rules.
"scripts/gates/ratchet.py" = ["S603", "S607"]
"scripts/gates/ratchet_harness.py" = ["S603", "S607"]
"scripts/gates/scope.py" = ["S603", "S607"]
