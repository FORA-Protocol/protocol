# sdk/python — the FORA SDK for Python, one of the three SDKs under sdk/ (go, ts, python).
#
# The `fora_sdk` import package bundles BOTH tiers in one distribution:
#   L1 — stateless, IO-free protocol mechanics (thumbprint, signed-URL verify,
#        RFC 9421 sign/verify + PoP, offer-acceptance, cross-field validation),
#        byte-parity-guarded against the sdk/go oracle. This tier's IMPORT surface
#        (fora_sdk.core and the signing primitives) pulls no third-party HTTP
#        client — it is dependency-free at the import level.
#   L2 — the two IO-bearing trees, which DO take a maintained HTTP client
#        (httpx/httpcore): the fetching resolvers (fora_sdk.resolvers) for the WBA /
#        well-known directory GETs, and the client (fora_sdk.client, with
#        fora_sdk.sync as its blocking facade) for the FORA RPCs and the delivery
#        fetch. The client refuses redirects where the resolvers follow them under a
#        cap: every leg it dials carries a credential.
# Because the two ship as one package, httpx/httpcore are HARD [project]
# dependencies, not an optional extra: a pure-L1 consumer still installs them.
# That is deliberate — keeping them non-optional means the SECURITY-relevant
# version ceilings below (httpx<0.29, httpcore<2, guarding the private-internals
# SSRF seam) bind EVERY install transitively, including consumers that declare
# httpx directly. So "dependency-free" describes the L1 import surface, NOT the
# package install. Published to PyPI as fora-protocol-sdk.
#
# Vetted libs the port uses (do NOT hand-roll crypto/canonicalization):
# cryptography>=44, pydantic>=2.9. The generated Pydantic
# types are consumed from gen/python (PYTHONPATH=gen/python at test time).

# Ruff: the rule set is the repository's shared one (../../ruff.toml), so the SDK, its
# tests, the hand-written code of gen/python and the scripts are linted alike. This file adds only
# per-module waivers, each with its own reason.
[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
# The WBA resolver's key-directory poll adds jitter to its interval so a fleet of
# verifiers does not poll in step. The jitter is not security-sensitive (it mirrors
# Go's math/rand), so S311 (non-cryptographic random) is waived for this module.
# The argument, branch and return limits are not waived anywhere: the functions this
# table used to exempt are listed one by one in the lint gate's baseline, so a new
# function in the same module is held to the limits.
"fora_sdk/resolvers/wba.py" = ["S311"]

# mypy: the repository's mypy.ini (../../mypy.ini) holds fora_sdk, its tests, the
# hand-written code of gen/python and the scripts to --strict; the types gate runs it.

[build-system]
requires = ["setuptools>=77"] # license-files (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "fora-protocol-sdk"
version = "1.2.1"
description = "FORA protocol SDK for Python: the IO-free protocol mechanics (thumbprint, signed-URL verification, RFC 9421 request signing and verification, offer and acceptance signatures, cross-field validation), the key and endpoint resolvers and the Connect-unary JSON client."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  # The generated wire/vocab packages (gen/python), published to PyPI as
  # fora-protocol. Pinned exactly: both distributions are built from the same
  # tag and the release workflow refuses a tag whose version differs from this
  # pin (scripts/release/check-versions.py).
  "fora-protocol==1.2.1",
  "cryptography>=44",
  # Maintained HTTP client for the L2 fetching resolvers (WBA / well-known
  # directory GETs). It owns the response state machine (status, redirects, 1xx,
  # decompression) so the SDK never hand-rolls a transport; the SSRF guard is
  # injected as an httpx transport (fora_sdk.resolvers.ssrf_guard). The pure
  # signing core (fora_sdk.signing_transport) remains transport-neutral and
  # imports no httpx — the dependency is scoped to the I/O layer.
  # Upper bounds are load-bearing, not hygiene: the SSRF guard attaches by
  # assigning transport._pool._network_backend — httpx/httpcore PRIVATE internals.
  # A future release that renames them would make that assignment a silent no-op
  # (Python creates a dead attribute, no error) and leave a pre-auth fetch path
  # UNGUARDED. ssrf_guard() now fails closed if the attr is absent, but the ceiling
  # keeps us on a version whose internals we have verified. Raise deliberately after
  # testing a newer release, never blindly.
  "httpx>=0.27,<0.29",
  # httpcore is httpx's transport engine; declared explicitly because the SSRF
  # guard subclasses httpcore.SyncBackend directly (resolvers._http._GuardedBackend).
  "httpcore>=1.0,<2",
  "pydantic>=2.9",
  # Vetted RFC 8785 JCS canonicalization for the offer/acceptance signed payload
  # (never hand-roll canonicalization). The core composes it; it is the JSON
  # canonicalizer half of the cross-language signing primitive.
  "rfc8785>=0.1.2",
  # Draft 2020-12 validation for the Exchange-published registration schema
  # (fora_sdk.regschema). Vetted rather than hand-rolled for the same reason as the
  # canonicalizer above; the floor is 4.23 because the `referencing` rewrite landed
  # in 4.18 and this SDK relies on an unresolvable reference FAILING rather than
  # being fetched. That backstop is belt-and-braces — regschema refuses a reference
  # leaving the document before the library is handed the schema at all — but it is
  # the belt, and a version whose resolver still dialled would remove it.
  "jsonschema>=4.23",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  # jsonschema ships no inline annotations, so the stub package is what keeps
  # fora_sdk.regschema under the same --strict bar as the rest of the surface.
  "types-jsonschema>=4.23",
]
# The ASGI server-binding extra (FastAPI/Starlette) is deferred with its binding.

# The Python quality gates' tools (scripts/gates/gate-python-*.sh). This group is the
# one place their versions are pinned, and uv.lock locks them. CI and the install
# command the gates print both sync this group from uv.lock, and the gates refuse to
# run unless sdk/python/.venv matches the lock. A group, not an extra, so it never
# reaches the published package's metadata.
[dependency-groups]
gates = [
  "ruff==0.17.4",
  "mypy==2.4.1",
  # The protobuf stubs, so mypy checks the descriptor_pb2 calls of the schema
  # generators under scripts/sdk-types instead of reading them as Any.
  "types-protobuf==7.35.1.20260906",
]

[project.urls]
Homepage = "https://fora-protocol.org"
Source = "https://github.com/FORA-Protocol/protocol"

[tool.setuptools.packages.find]
where = ["."]
include = ["fora_sdk*"]

# The inline-types marker, in the wheel and the sdist: without it mypy reports
# "missing library stubs or py.typed marker" and every symbol becomes Any.
[tool.setuptools.package-data]
fora_sdk = ["py.typed"]


# Development only: resolve fora-protocol from the in-repo gen/python tree so uv can
# lock and sync before (and independently of) the PyPI release. uv sources never
# reach the built wheel/sdist metadata, which keeps the exact PyPI pin above.
[tool.uv.sources]
fora-protocol = { path = "../../gen/python", editable = true }
