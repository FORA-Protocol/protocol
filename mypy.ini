# mypy settings for every hand-written Python file the gates cover: the SDK package
# (sdk/python/fora_sdk), its tests (sdk/python/tests), the hand-written modules and
# tests of gen/python, and the scripts under scripts/.
# scripts/gates/gate-python-types.sh runs it over the files scripts/gates/scope.py lists.
#
# All of them are held to --strict, the tests and the scripts included. The SDK suite
# was written annotated, so strict costs it little, and it is the only setting under
# which mypy checks what a test passes to the SDK: without the annotation rules, an
# unannotated test or helper takes Any, and every call it makes goes unchecked.

[mypy]
python_version = 3.11
strict = True

# Pydantic's own mypy plugin, so mypy reads a model's constructor the way pydantic
# builds it: field aliases and defaults. Without it, every model built by alias or
# with a defaulted field is reported as a call with a missing or unexpected argument.
plugins = pydantic.mypy

# The generated modules are excluded when the gate names their directory (see the
# section for them below).
exclude = ^gen/python/(wire/(models|unique|version)\.py|vocab/)

# The tests import the SDK and the generated types from the source trees, as the test
# runs do (PYTHONPATH=gen/python:sdk/python). Each file is named as the module it is
# imported as: explicit_package_bases names a file by the mypy_path entry it sits
# under, so gen/python/wire/base.py is the wire.base the tests import, not a second
# module "base". The test and tooling directories are entries too, because their
# files import each other by bare name (conftest, ratchet_harness, version): pytest
# and unittest put the test's own directory on sys.path, and Python puts a script's
# own directory there (scripts/release/check-versions.py imports version).
mypy_path = $MYPY_CONFIG_FILE_DIR/sdk/python:$MYPY_CONFIG_FILE_DIR/gen/python:$MYPY_CONFIG_FILE_DIR/sdk/python/tests:$MYPY_CONFIG_FILE_DIR/gen/python/tests:$MYPY_CONFIG_FILE_DIR/scripts/gates:$MYPY_CONFIG_FILE_DIR/scripts/release
explicit_package_bases = True

# The generated modules of the types export (gen/python): wire/models.py,
# wire/unique.py, wire/version.py and vocab/, which scripts/gen-sdk-types.sh and buf
# write from proto/.
# They are read for their types and never reported; models.py uses constr(...) and
# conint(...) call-form annotations that mypy flags. The hand-written modules beside
# them (wire/base.py, names.py, schemas.py) are checked like any other file.
[mypy-wire.models,wire.unique,wire.version,vocab.*]
follow_imports = silent
