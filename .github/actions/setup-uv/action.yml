name: setup-uv
description: >-
  Install the uv this repository pins, from a pinned commit of astral-sh/setup-uv.
  Every workflow that needs uv uses this action after its checkout, so the commit
  and the uv version are written once.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        version: 0.12.11
