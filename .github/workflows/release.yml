name: release

# Tag-triggered release of the Python and TypeScript SDKs.
#   1. version gate: the tag equals every released manifest version
#   2. the three CI workflows run on the exact tagged commit (workflow_call)
#   3. build once into the GitHub Release; SHA256SUMS is the completeness marker
#   4. publish per file to PyPI and npm through trusted publishing (OIDC), after
#      approval in the `release` environment; existing files are digest-checked
#   5. install from each registry in a clean environment; Go proxy resolves the tag
# Rerunning the workflow on the same tag is the recovery procedure. The tag
# never moves. No registry token is stored in the repository.
# The publish jobs verify the release assets against the SHA256SUMS content the
# build job emitted (job output), so a replaced asset or marker between build
# and approval fails publication. This pins bytes within one run only; a full
# rerun reads the release as its starting point.
# Every external action is pinned to a commit SHA (the tag is the comment) and
# every tool to an exact version: the build and publish jobs hold this
# workflow's OIDC identity, so a retargeted tag or a bad tool release could
# otherwise publish under the project's names.
# No checkout keeps the job token in .git/config (persist-credentials: false):
# no job needs a git credential after checkout, and the build job's contents:
# write token must not be readable by the dependencies the smoke tests install.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One run per tag at a time: two builders on one tag could interleave asset
# uploads with the marker. Mutual exclusion only: GitHub keeps one pending run
# per group and a newer pending run replaces the older one; a rerun on the same
# tag is idempotent, so nothing is lost. Never cancel a build mid-upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: tag equals every released manifest version
        run: python3 scripts/release/check-versions.py "${GITHUB_REF_NAME#v}"

  # No secrets are passed: the only secret the called workflows use is
  # GITHUB_TOKEN, which a called workflow receives without `secrets: inherit`.
  proto-ci:
    needs: versions
    uses: ./.github/workflows/proto-ci.yml
  sdk-types-ci:
    needs: versions
    uses: ./.github/workflows/sdk-types-ci.yml
  docs-ci:
    needs: versions
    uses: ./.github/workflows/docs-ci.yml

  build:
    needs: [proto-ci, sdk-types-ci, docs-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets
    outputs:
      sha256sums: ${{ steps.build.outputs.sha256sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json
      # build.sh uses the token only to read and write the release. The build and
      # the smoke tests (build-artifacts.sh) run under it WITHOUT the token: they
      # install dependencies from the registry, and nothing that comes from there
      # may see the token or touch the artifact set before the checksums exist.
      - id: build
        name: build once, or verify the existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/build.sh "$GITHUB_REF_NAME"

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.11
      - name: download the release files and verify them against the build job's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: scripts/release/download.sh "$GITHUB_REF_NAME" release-dist "$SHA256SUMS"
      - name: publish fora-protocol, then fora-protocol-sdk
        run: scripts/release/publish-pypi.sh release-dist "${GITHUB_REF_NAME#v}"

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm 11.5.1+ (trusted publishing), exact version
        run: npm install -g npm@11.19.1 && npm --version
      - name: download the release files and verify them against the build job's SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256SUMS: ${{ needs.build.outputs.sha256sums }}
        run: scripts/release/download.sh "$GITHUB_REF_NAME" release-dist "$SHA256SUMS"
      - name: publish @fora-protocol/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }} # temporary: bootstrap the first publish; drop once trusted publishing is configured on npm
        run: scripts/release/publish-npm.sh \
          "release-dist/fora-protocol-sdk-${GITHUB_REF_NAME#v}.tgz" \
          "${GITHUB_REF_NAME#v}"

  verify:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: 0.12.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Registries can lag a publish by a minute or two; each check retries.
      # Only the SDK is requested: PyPI must resolve fora-protocol through the
      # SDK's exact pin, which is the resolution a consumer's install performs
      # and the one no pre-publish check can (both files are handed to it).
      - name: PyPI wheel installs and imports, with fora-protocol resolved from PyPI
        run: |
          v=${GITHUB_REF_NAME#v}
          for i in 1 2 3 4 5 6; do
            scripts/release/smoke-python.sh "fora-protocol-sdk==$v" && exit 0

            sleep 30
          done
          exit 1
      - name: PyPI sdists rebuild into working wheels
        shell: bash # pipefail: a failed JSON lookup must not read as an empty URL
        run: |
          v=${GITHUB_REF_NAME#v}
          mkdir sdists
          for n in fora-protocol fora-protocol-sdk; do
            url=$(curl -sf "https://pypi.org/pypi/$n/$v/json" | jq -r '.urls[] | select(.packagetype == "sdist") | .url')
            curl -sfLo "sdists/$(basename "$url")" "$url"
          done
          scripts/release/smoke-python.sh sdists/*.tar.gz
      - name: npm package installs, imports and typechecks
        run: |
          v=${GITHUB_REF_NAME#v}
          for i in 1 2 3 4 5 6; do
            scripts/release/smoke-npm.sh "@fora-protocol/sdk@$v" && exit 0
            sleep 30
          done
          exit 1
      - name: Go module proxy resolves the tag
        env:
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          cd "$(mktemp -d)" && go mod init probe >/dev/null
          go list -m "github.com/FORA-Protocol/protocol@$GITHUB_REF_NAME"
