name: docs-ci

# Guards the documentation site against the proto contract — the PR gate the
# docs-drift tooling was missing.
#   - npm test: the remark-proto fail-path suite (proves the guard still throws on
#     an unknown proto reference)
#   - npm run build: astro build runs the remark-proto guard (build FAILS on an
#     unknown reference / hand-typed enum table) and starlight-links-validator
#   - npm run routes:check: a URL that main served must still answer, either as
#     a route or as a rule in website/redirects.json (applied by amplify.yml)
# Everything reads the committed gen/descriptor.binpb — no buf, no Go, no prebuild.
# Complements proto-ci (which gates the committed descriptor against the proto);
# together they chain docs -> descriptor -> proto.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'proto/**'
      - 'gen/descriptor.binpb'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'proto/**'
      - 'gen/descriptor.binpb'
      - '.github/workflows/docs-ci.yml'

  # Also callable from release.yml, so the tag release runs this gate on the
  # exact tagged commit. The push/pull_request triggers above are unchanged.
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Job: ${{ github.job }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@bfb7dd8bb70aaa904cdc53cb6bae2fd43e78589b # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          output-credentials: true
          role-duration-seconds: 900
          role-session-name: github-actions-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: npm ci
        run: npm ci

      - name: docs guards (remark-proto fail-path)
        run: npm test

      - name: build (remark guard + link validator)
        run: npm run build

      # The link validator above only sees links inside the site. This sees the
      # other half: a URL that main served and this branch does not. Needs main
      # fetched, which the shallow checkout above does not provide.
      - name: fetch main for the route comparison
        run: git fetch --depth=1 origin main

      - name: route retirement gate
        run: npm run routes:check
