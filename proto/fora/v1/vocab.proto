// FORA — options read by this repository's code generators.
//
// Defines the custom field option that carries registry-governed vocabularies
// directly on the fields that use them. The token list for an open axis (the
// metering basis on Pricing.unit, and sibling axes that follow) is authored in
// exactly one place: the (fora.v1.vocab) entries on the field itself.
//
// A small buf plugin (protoc-gen-foravocab) reads these entries structurally
// off the field descriptor and emits typed string constants, an All slice, and
// an IsRegistered membership check per axis. Structural validation (format) and
// cross-field rules live in protovalidate CEL — never re-listing the tokens —
// so the constants, the membership check, and the registry cannot drift.
//
// It also defines the two file options that carry the FORA protocol version and
// the /.well-known/fora.json document version. fora.proto sets each of them
// once, and a second plugin (protoc-gen-foraversion) emits them as constants for
// Go, TypeScript and Python, which the SDKs re-export.

syntax = "proto3";

package fora.v1;

option go_package = "github.com/FORA-Protocol/protocol/gen/go/fora/v1;forav1";

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // vocab carries the registered bare tokens for an open vocabulary axis,
  // authored directly on the field that uses it as a repeated custom option.
  // Number 50001 sits in the internal extension range (50000–99999). Field
  // axes (Pricing.unit, Quota.metric) carry their tokens here; axes selected
  // by an enum value (function, geography, user-type, selected by
  // RestrictionKind) carry their tokens on the enum-value extension below.
  repeated string vocab = 50001;

  // vocab_package names the generated SDK package/module for this field's axis
  // (e.g. "pricingunits", "quotametrics"). It lives on the field — alongside the
  // tokens — so the axis→package mapping is part of the single proto source and
  // protoc-gen-foravocab needs no hand-maintained mapping table. Required on any
  // field that carries (fora.v1.vocab).
  optional string vocab_package = 50003;
}

extend google.protobuf.EnumValueOptions {
  // vocab_enum is the enum-value-scoped twin of (fora.v1.vocab) above. Axes
  // whose token list is selected by an enum value — the function / geography /
  // user-type tokens carried in Restriction.permitted/prohibited and selected
  // by Restriction.kind — author their tokens directly on the corresponding
  // RestrictionKind enum value. Same registry mechanism: protoc-gen-foravocab
  // reads these entries structurally off the enum-value descriptor and emits
  // the per-axis constants + IsRegistered. This is a separate extension because
  // an extend block targets one options message — 50001 cannot also extend
  // EnumValueOptions; 50002 is the next slot in the same internal block.
  repeated string vocab_enum = 50002;

  // vocab_enum_package is the enum-value twin of (fora.v1.vocab_package): it
  // names the generated package/module for an axis selected by an enum value
  // (e.g. "functiontokens"). Required on any enum value that carries
  // (fora.v1.vocab_enum).
  optional string vocab_enum_package = 50004;

  // vocab_enum_alias carries the accepted alias spellings of an axis, one
  // "alias=canonical" entry each, authored beside the tokens they resolve to.
  // An alias is a spelling another vocabulary uses for a registered token
  // (AIPREF's "train-ai" for "ai-train", the industry's "generative-ai" for
  // "ai-input"); a consumer canonicalises it to the registered token at ingest
  // and never stores or emits it. The plugin refuses an alias that is itself
  // a token, a canonical that is not one, a duplicate, and a spelling that is
  // not already trimmed and lowercase — the SDK folds a token before it looks
  // it up, so any other spelling could never match. Enum-value axes only; the
  // field-axis twin takes 50006 when an axis needs one.
  repeated string vocab_enum_alias = 50005;
}

extend google.protobuf.FileOptions {
  // protocol_version is the FORA protocol version: the value every request and
  // response stamps on its `ver` field. fora.proto sets it once, beside the
  // "Protocol version" block that states its rules, and no other file sets it.
  // The value is a canonical MAJOR.MINOR, such as "1.0": two runs of ASCII
  // digits, no leading zero. protoc-gen-foraversion emits it as ProtocolVersion
  // in Go (in fora.v1's generated package) and TypeScript, and as
  // PROTOCOL_VERSION in Python. 50007 and 50008 continue the internal block the
  // vocabulary options use; 50006 stays free for the field-axis alias twin.
  optional string protocol_version = 50007;

  // well_known_manifest_version is the version of the /.well-known/fora.json
  // document's layout, stamped on WellKnownManifest.ver. It is a separate
  // namespace and is never derived from protocol_version: a change to the
  // document's layout bumps both numbers. fora.proto sets it once, beside
  // protocol_version and in the same canonical MAJOR.MINOR form;
  // protoc-gen-foraversion emits it as WellKnownManifestVersion (Go and
  // TypeScript) and WELL_KNOWN_MANIFEST_VERSION (Python).
  optional string well_known_manifest_version = 50008;
}
